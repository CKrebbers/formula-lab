<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formula Lab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f0f1b; overflow: hidden; }
    [hidden] { display: none !important; } /* beat explicit display: flex on hideable elements */
    body, input, button, textarea { font: 12px/1.4 monospace; color: #c6b7be; }
    #canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }

    #panel {
      position: fixed; top: 8px; left: 8px; width: 360px;
      background: rgba(15, 15, 27, 0.85); border: 1px solid #565a75;
      padding: 8px; display: flex; flex-direction: column; gap: 6px;
    }
    #formula {
      width: 100%; box-sizing: border-box; resize: vertical;
      background: #0f0f1b; color: #fafbf6; border: 1px solid #565a75;
      padding: 4px 6px; outline: none;
    }
    #formula:focus { border-color: #c6b7be; }
    #family {
      background: #0f0f1b; color: #c6b7be; border: 1px solid #565a75;
      padding: 2px 4px; outline: none;
    }
    #error {
      margin: 0; padding: 4px 6px; white-space: pre-wrap;
      color: #ff5566; background: rgba(255, 85, 102, 0.08);
      border: 1px solid rgba(255, 85, 102, 0.4);
    }
    #sliders { display: flex; flex-direction: column; gap: 2px; }
    .slider-wrap { display: flex; flex-direction: column; }
    .slider-row { display: flex; align-items: center; gap: 6px; }
    .slider-row.locked { opacity: 0.55; }
    .slider-row.automated .slider-name { color: #8be9b6; }
    .auto-row {
      display: flex; align-items: center; gap: 6px;
      padding: 2px 0 4px 30px; color: #8be9b6;
    }
    .auto-label { font-size: 10px; }
    .mini-range { width: 90px; accent-color: #8be9b6; }
    .slider-name { width: 24px; text-align: right; color: #fafbf6; }
    .slider-row input[type="range"] { flex: 1; accent-color: #c6b7be; }
    .slider-value { width: 60px; text-align: right; }
    .slider-btn {
      background: none; border: 1px solid #565a75; color: #c6b7be;
      cursor: pointer; padding: 0 5px; line-height: 1.5;
    }
    .slider-btn:hover:not(:disabled) { border-color: #c6b7be; color: #fafbf6; }
    .slider-btn:disabled { opacity: 0.4; cursor: default; }
    #actions, #actions2 { display: flex; gap: 6px; flex-wrap: wrap; }
    select.slider-btn { appearance: none; }
    #lineage:empty { display: none; }
    .lineage-head {
      display: flex; justify-content: space-between; align-items: center;
      color: #8be9b6; padding: 2px 0;
    }
    .stars button {
      background: none; border: none; color: #c6b7be; cursor: pointer;
      padding: 0 1px; font-size: 13px;
    }
    .stars button:hover { color: #fafbf6; }
    .lineage-row { display: flex; align-items: center; gap: 4px; padding: 2px 0; }
    .lineage-tag { width: 52px; font-size: 10px; color: #565a75; }
    .lineage-row img {
      width: 32px; height: 32px; cursor: pointer;
      image-rendering: pixelated; border: 1px solid #565a75;
    }
    .lineage-row img:hover { border-color: #fafbf6; }
    #auto.active { border-color: #8be9b6; color: #8be9b6; }
    body.display #panel { display: none; }
    body.display .display-layer {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      cursor: none; image-rendering: pixelated;
      transition: opacity 0.9s ease;
    }
    body.display #status { z-index: 1000; }
    .elites-label { font-size: 10px; color: #565a75; padding: 2px 0; }
    .elites-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; }
    .elite-cell {
      aspect-ratio: 1; background: #14142230 center / cover;
      border: 1px solid #23263a; box-sizing: border-box;
    }
    .elite-cell.filled { cursor: pointer; border-color: #565a75; }
    .elite-cell.filled:hover { border-color: #fafbf6; }
    .archive-rating {
      position: absolute; left: 0; bottom: 0; font-size: 9px;
      background: rgba(15, 15, 27, 0.85); color: #8be9b6; padding: 0 3px;
      pointer-events: none;
    }
    #sheet {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    }
    #sheet:empty { display: none; }
    #sheet canvas {
      width: 100%; display: block; cursor: pointer;
      image-rendering: pixelated; border: 1px solid #565a75; box-sizing: border-box;
    }
    #sheet canvas:hover { border-color: #fafbf6; }
    #sheet canvas.original { border-color: #8be9b6; cursor: default; }
    #archive {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
      max-height: 180px; overflow-y: auto;
    }
    #archive:empty { display: none; }
    .archive-item { position: relative; }
    .archive-item img {
      width: 100%; display: block; cursor: pointer;
      image-rendering: pixelated; border: 1px solid #565a75; box-sizing: border-box;
    }
    .archive-item img:hover { border-color: #fafbf6; }
    .archive-del {
      position: absolute; top: 0; right: 0; display: none;
      background: rgba(15, 15, 27, 0.85); border: none; color: #ff5566;
      cursor: pointer; padding: 0 3px; font-size: 10px;
    }
    .archive-item:hover .archive-del { display: block; }

    #status {
      position: fixed; left: 8px; bottom: 8px;
      background: rgba(15, 15, 27, 0.7); padding: 4px 8px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="panel">
    <select id="family" title="load a starter formula family"></select>
    <textarea id="formula" rows="3" spellcheck="false"></textarea>
    <pre id="error" hidden></pre>
    <div id="sliders"></div>
    <div id="actions">
      <button id="reroll-all" class="slider-btn" title="reroll all unlocked params">⟳ all</button>
      <button id="coords" class="slider-btn" title="coordinates: cartesian → polar → toroidal">cart</button>
      <button id="make-sheet" class="slider-btn" title="quick sheet: 8 const_tweak variants">3×3</button>
      <button id="mutate" class="slider-btn" title="mutation sheet: §6 operators, filtered, sorted by novelty">mut</button>
      <button id="xover" class="slider-btn" title="crossover with a random archived snapshot">xover</button>
      <select id="mask" class="slider-btn" title="mutation mask">
        <option value="all">all</option>
        <option value="constants">const</option>
        <option value="structure">struct</option>
      </select>
      <button id="auto" class="slider-btn" title="zero-player: auto-explore fills the elites grid, main view follows every discovery">auto</button>
      <button id="out" class="slider-btn" title="open a display window (drag to a second screen, click its canvas for fullscreen)">⧉ out</button>
    </div>
    <div id="actions2">
      <button id="save" class="slider-btn" title="save snapshot to archive">save</button>
      <button id="permalink" class="slider-btn" title="copy permalink URL">link</button>
      <button id="export" class="slider-btn" title="download archive as JSON">exp</button>
      <button id="import" class="slider-btn" title="import archive JSON">imp</button>
      <select id="sort" class="slider-btn" title="archive sort">
        <option value="new">new</option>
        <option value="top">top</option>
        <option value="novel">novel</option>
      </select>
      <input id="import-file" type="file" accept=".json,application/json" hidden />
    </div>
    <div id="sheet"></div>
    <div id="lineage"></div>
    <div id="elites"></div>
    <div id="archive"></div>
  </div>
  <div id="status">loading…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
